<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fd6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1a2230" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.5"/>

  <circle cx="1000" cy="130" r="170" fill="url(#glow)"/>

  <g stroke="#3fd6ff" stroke-width="1.4" opacity="0.55">
    <circle cx="1000" cy="130" r="96" fill="none"/>
    <circle cx="1000" cy="130" r="118" fill="none" stroke-dasharray="2 10"/>
    <circle cx="1000" cy="130" r="66" fill="none" opacity="0.5"/>
  </g>
  <g stroke="#3fd6ff" stroke-width="2" opacity="0.8">
    <line x1="1000" y1="34" x2="1000" y2="54"/>
    <line x1="1000" y1="206" x2="1000" y2="226"/>
    <line x1="904" y1="130" x2="924" y2="130"/>
    <line x1="1076" y1="130" x2="1096" y2="130"/>
  </g>
  <circle cx="1000" cy="130" r="7" fill="#3fd6ff" filter="url(#soft)"/>

  <text x="64" y="118" font-family="Consolas, 'Courier New', monospace" font-size="46" fill="#eef4ff" font-weight="700">
    MUSHAF ZARRAR
  </text>
  <text x="64" y="156" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#7da2c1">
